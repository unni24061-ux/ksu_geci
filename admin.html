<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>KSU GECI – Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,system-ui,sans-serif;color:#1b2433;background:#f5f7fa}
.box,.box2{background:#fff;border:1px solid #e3e8ef;border-radius:6px;padding:16px;display:grid;gap:10px;margin-bottom:14px}.box{max-width:340px;margin:12vh auto}
h3{margin:4px 0 0;font-size:15px}small{color:#5f6b7a}
input,select,textarea,button{font:inherit;padding:9px 10px;border:1px solid #d5dce6;border-radius:6px;background:#fff;color:inherit;width:100%}
button{width:auto;cursor:pointer;background:#134a9e;color:#fff;border-color:#134a9e}button.d{background:#fff;color:#a12b2b;border-color:#e3b9b9}button:disabled{opacity:.5}
header{background:#fff;border-bottom:1px solid #e3e8ef;padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}header b{color:#0b2a55}
#tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}#tabs button{background:#fff;color:#1b2433;border-color:#e3e8ef}#tabs button.on{background:#134a9e;color:#fff}
main{max-width:900px;margin:18px auto;padding:0 14px}
.it{background:#fff;border:1px solid #e3e8ef;border-radius:6px;padding:12px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}.it>p{flex-basis:100%;margin:2px 0}
.r{display:grid;grid-template-columns:150px 1fr auto auto;gap:6px;flex-basis:100%}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.th{display:flex;gap:6px;flex-wrap:wrap}.th span{position:relative}.th img{width:84px;height:56px;object-fit:cover;border-radius:4px}.th button{position:absolute;top:2px;right:2px;padding:0 6px;border-radius:50%}
#msg{position:fixed;bottom:18px;left:50%;transform:translate(-50%,80px);background:#1b2433;color:#fff;padding:9px 16px;border-radius:6px;transition:.3s}#msg.s{transform:translate(-50%,0)}
@media(max-width:620px){.r,.g2{grid-template-columns:1fr}}
</style></head><body>
<form id="lf" class="box"><h3>KSU GECI Admin</h3><input name="email" type="email" placeholder="Email" required autocomplete="username"><input name="pw" type="password" placeholder="Password" required autocomplete="current-password"><button>Sign in</button><small id="le" style="color:#a12b2b"></small></form>
<div id="app" hidden><header><b>KSU GECI Admin</b><div id="tabs"></div><button id="out" class="d">Sign out</button></header><main id="v"></main></div>
<div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LIVE=!!(window.KSU&&KSU.url&&!KSU.url.includes('YOUR-')&&window.supabase);
const sb=LIVE?supabase.createClient(KSU.url,KSU.key):null;
const msg=t=>{const m=$('#msg');m.textContent=t;m.classList.add('s');clearTimeout(m._t);m._t=setTimeout(()=>m.classList.remove('s'),2200)};
const ok=r=>msg(r.error?'Error: '+r.error.message:'Saved');
const show=on=>{$('#lf').hidden=on;$('#app').hidden=!on};
async function boot(){if(!LIVE){$('#le').textContent='Please set your Supabase URL & Key in config.js first.';return show(false)}const {data:{session}}=await sb.auth.getSession();if(!session)return show(false);const r=await sb.rpc('is_admin');if(!r.data){await sb.auth.signOut();$('#le').textContent='This account is not an admin.';return show(false)}show(true);go('cmp')}
$('#lf').onsubmit=async e=>{e.preventDefault();if(!LIVE){$('#le').textContent='Please set your Supabase URL & Key in config.js first.';return}const f=e.target,r=await sb.auth.signInWithPassword({email:f.email.value,password:f.pw.value});if(r.error){$('#le').textContent=r.error.message;return}boot()};
$('#out').onclick=async()=>{if(sb)await sb.auth.signOut();show(false)};
const T={cmp:'Complaints',not:'Notifications',ev:'Events',con:'Contacts',help:'Help desks'};
$('#tabs').innerHTML=Object.entries(T).map(([k,v])=>`<button data-t="${k}">${v}</button>`).join('');
$('#tabs').onclick=e=>{const t=e.target.dataset.t;if(t)go(t)};
function go(t){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));({cmp:vCmp,not:vNot,ev:vEv,con:vCon,help:vHelp})[t]()}
const ST=['Pending','Under review','Resolved','Rejected'];let EV={id:null,imgs:[]};
const A={
 async sv(it){ok(await sb.from('complaints').update({status:it.querySelector('select').value,remark:it.querySelector('input').value}).eq('id',it.dataset.id));it.dataset.s=it.querySelector('select').value},
 async rm(it){if(confirm('Delete this complaint?')){ok(await sb.from('complaints').delete().eq('id',it.dataset.id));it.remove()}},
 async nd(it){ok(await sb.from('notifications').delete().eq('id',it.dataset.id));it.remove()},
 async ed(it){const r=await sb.from('events').select('*').eq('id',it.dataset.id).single();EV={id:r.data.id,imgs:r.data.images||[]};vEv(r.data)},
 async ev(it){if(confirm('Delete this event?')){ok(await sb.from('events').delete().eq('id',it.dataset.id));it.remove()}},
 im(it,b){EV.imgs.splice(+b.dataset.i,1);drawImgs()},
 cx(){EV={id:null,imgs:[]};vEv()}};
$('#v').onclick=e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](b.closest('.it')||b.parentElement,b)};

async function vCmp(){const r=await sb.from('complaints').select('*').order('created_at',{ascending:false});const L=r.data||[];
 $('#v').innerHTML=`<p><select id="fl" style="width:auto"><option value="">All (${L.length})</option>${ST.map(s=>`<option>${s}</option>`).join('')}</select></p><div id="cl">${L.map(c=>`<div class="it" data-id="${c.id}" data-s="${c.status}"><b>${esc(c.subject)}</b><small>${c.id} · ${c.created_at.slice(0,10)} · ${esc(c.sem||'')} ${esc(c.branch||'')}</small><p>${esc(c.body)}</p><small>${esc(c.name||'—')} · ${esc(c.phone||'—')}</small><div class="r"><select>${ST.map(s=>`<option${s===c.status?' selected':''}>${s}</option>`).join('')}</select><input placeholder="Note visible to the student" value="${esc(c.remark)}"><button data-a="sv">Save</button><button class="d" data-a="rm">Delete</button></div></div>`).join('')||'<p>No complaints yet.</p>'}</div>`;
 $('#fl').onchange=e=>document.querySelectorAll('#cl .it').forEach(i=>i.hidden=!!e.target.value&&i.dataset.s!==e.target.value)}

async function vNot(){const r=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(50);
 $('#v').innerHTML=`<form id="nf" class="box2"><h3>New notification</h3><input name="t" placeholder="e.g. Union meeting Friday 4 PM" required><div><button>Publish</button></div></form>${(r.data||[]).map(n=>`<div class="it" data-id="${n.id}"><span>${esc(n.text)} <small>${n.created_at.slice(0,10)}</small></span><button class="d" data-a="nd">Delete</button></div>`).join('')}`;
 $('#nf').onsubmit=async e=>{e.preventDefault();ok(await sb.from('notifications').insert({text:e.target.t.value}));vNot()}}

const up=file=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1400/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);
 c.toBlob(async b=>{const p=Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg',r=await sb.storage.from('events').upload(p,b,{contentType:'image/jpeg'});if(r.error)return rej(r.error);res(sb.storage.from('events').getPublicUrl(p).data.publicUrl)},'image/jpeg',.78)};i.onerror=rej;i.src=URL.createObjectURL(file)});
const drawImgs=()=>{$('#im').innerHTML=EV.imgs.map((u,i)=>`<span><img src="${esc(u)}" alt=""><button type="button" data-a="im" data-i="${i}">×</button></span>`).join('')};
async function vEv(x){x=x&&x.title?x:{};if(!x.title)EV={id:null,imgs:[]};const r=await sb.from('events').select('id,title,date,images').order('date',{ascending:false});
 $('#v').innerHTML=`<form id="ef" class="box2"><h3>${EV.id?'Edit event':'Add event'}</h3><input name="title" placeholder="Title" required value="${esc(x.title)}"><div class="g2"><input name="date" type="date" required value="${esc(x.date)}"><input name="place" placeholder="Venue" value="${esc(x.place)}"></div><textarea name="descr" rows="3" placeholder="Description">${esc(x.descr)}</textarea><input type="file" accept="image/*" multiple><div id="im" class="th"></div><div><button>${EV.id?'Update':'Publish'} event</button>${EV.id?' <button type="button" data-a="cx" class="d">Cancel</button>':''}</div></form>${(r.data||[]).map(e=>`<div class="it" data-id="${e.id}"><span><b>${esc(e.title)}</b> <small>${e.date} · ${(e.images||[]).length} photos</small></span><span><button data-a="ed">Edit</button> <button class="d" data-a="ev">Delete</button></span></div>`).join('')}`;
 drawImgs();
 $('#ef').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('div>button'),d=Object.fromEntries(new FormData(f));b.disabled=true;msg('Saving…');
  try{for(const file of f.querySelector('[type=file]').files){if(EV.imgs.length>=10)break;EV.imgs.push(await up(file))}
   const row={title:d.title,date:d.date,place:d.place,descr:d.descr,images:EV.imgs};ok(EV.id?await sb.from('events').update(row).eq('id',EV.id):await sb.from('events').insert(row));EV={id:null,imgs:[]};vEv()}
  catch(err){msg('Error: '+(err.message||err));b.disabled=false}}}

async function vCon(){const [p,s]=await Promise.all([sb.from('people').select('*').order('sort'),sb.from('settings').select('*')]);const S=Object.fromEntries((s.data||[]).map(x=>[x.key,x.value]));
 const tx=g=>(p.data||[]).filter(x=>x.grp===g).map(x=>[x.role,x.name,x.phone].join(' | ')).join('\n');
 $('#v').innerHTML=`<form id="cf" class="box2"><h3>KSU GECI team</h3><small>One per line: Role | Name | Phone</small><textarea name="ksu" rows="6">${esc(tx('ksu'))}</textarea><h3>College officials</h3><textarea name="col" rows="6">${esc(tx('col'))}</textarea><h3>Channels</h3><div class="g2"><input name="wa" placeholder="WhatsApp with country code, e.g. 919876543210" value="${esc(S.wa)}"><input name="email" placeholder="Email" value="${esc(S.email)}"></div><input name="ig" placeholder="Instagram username (no @)" value="${esc(S.ig)}"><input name="group" placeholder="Admission WhatsApp group link (https://chat.whatsapp.com/…)" value="${esc(S.group)}"><div><button>Save contacts</button></div></form>`;
 $('#cf').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
  for(const g of['ksu','col']){const rows=d[g].split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a[0]).map((a,i)=>({grp:g,role:a[0],name:a[1]||'',phone:a[2]||'',sort:i}));let r=await sb.from('people').delete().eq('grp',g);if(r.error)return ok(r);if(rows.length){r=await sb.from('people').insert(rows);if(r.error)return ok(r)}}
  ok(await sb.from('settings').upsert(['wa','email','ig','group'].map(k=>({key:k,value:d[k].replace(k==='wa'?/\D/g:/^@/,'')}))))}}

async function vHelp(sel){const r=await sb.from('helpdesks').select('*').order('slug');const L=r.data||[],h=L.find(x=>x.slug===sel)||L[0];
 if(!h){$('#v').innerHTML='<p>No help desks found. Run the seed section of schema.sql.</p>';return}
 $('#v').innerHTML=`<form id="hf" class="box2"><h3>Edit help desk</h3><select id="hs">${L.map(x=>`<option value="${x.slug}"${x.slug===h.slug?' selected':''}>${esc(x.title)}</option>`).join('')}</select><input name="title" value="${esc(h.title)}" placeholder="Title"><input name="blurb" value="${esc(h.blurb)}" placeholder="Short description"><small>Start each section with # Heading. Lines like Name | Value become a table; other lines become a list.</small><textarea name="body" rows="10">${esc(h.body)}</textarea><div><button>Save help desk</button></div></form>`;
 $('#hs').onchange=e=>vHelp(e.target.value);
 $('#hf').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));ok(await sb.from('helpdesks').update({title:d.title,blurb:d.blurb,body:d.body}).eq('slug',h.slug))}}
boot();
</script></body></html>
